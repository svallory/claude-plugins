name: CI

on:
  push:
  pull_request:

# The shell-script jobs (bash -n, shellcheck) moved with the hyper plugin to
# svallory/hyper-coding (.github/workflows/agent-plugin.yml) — no plugin in
# this repo ships shell scripts anymore.
jobs:
  json:
    name: validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked JSON files
        # tsconfig*.json is JSONC (TypeScript permits comments) — not strict JSON, skipped.
        run: |
          rc=0
          while IFS= read -r f; do
            case "$(basename "$f")" in tsconfig*.json) continue ;; esac
            jq empty "$f" || { echo "invalid JSON: $f" >&2; rc=1; }
          done < <(git ls-files '*.json')
          exit "$rc"
