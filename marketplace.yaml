name: svallory-plugins
owner: Saulo Vallory
# Plugins that live in another repository but ship in this marketplace.
# Local plugins (plugins/*/plugin.yaml) are discovered automatically.
external:
  - name: hyper
    description: >-
      Hyper Coding workflow support: project spaces (a bare repo wrapping all of a project's worktrees plus local-only dirs), per-edit integration with the linters and typecheckers a project already uses, spec-driven planning, and template-driven generation.
    source:
      source: git-subdir
      url: https://github.com/svallory/hyper-coding.git
      path: agent-plugin
